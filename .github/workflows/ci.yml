name: Playwright tests + AI triage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test --reporter=json > test-results/results.json
        continue-on-error: true # we want triage to run even if tests fail

      - name: AI failure triage
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run triage -- test-results/results.json

      - name: Upload triage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-report
          path: triage-report.md
